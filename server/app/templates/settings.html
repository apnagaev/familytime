{% extends "base.html" %}
{% block content %}
<h1>Общие настройки</h1>
<div class="card">
  <form method="post" action="/settings">
    <input type="hidden" name="csrf" value="{{ user.csrf }}">
    <h2>Локация компьютеров</h2>
    <div class="row">
      <label>Отправлять раз в, мин <input type="number" name="interval_minutes" value="{{ s.location.interval_minutes }}" min="1" max="240"></label>
      <label>…если потерян, мин <input type="number" name="lost_interval_minutes" value="{{ s.location.lost_interval_minutes }}" min="1" max="60"></label>
    </div>
    <label class="block">Сообщение на экране потерянного компьютера (по умолчанию)</label>
    <textarea name="lost" style="min-height: 60px">{{ s.messages.lost }}</textarea>
    <div class="row" style="margin-top: 10px"><button>Сохранить</button></div>
  </form>
  <p class="hint">Действует на все компьютеры всех семей. Сайты, программы, подписки, простой и предупреждения настраиваются на странице каждого ребёнка, тексты сообщений и чаты Telegram — на странице семьи.</p>
</div>
{% endblock %}
