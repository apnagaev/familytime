name: agent

on:
  push:
    paths: ["agent/**", ".github/workflows/agent.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest && python -m pytest -q tests/agent

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", architecture: x64}
      - name: build
        shell: pwsh
        run: ./agent/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyTime-agent
          path: agent/dist/FamilyTime-*.zip
